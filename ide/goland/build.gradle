plugins {
    id "java"
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.intellij.platform"
}

group = "bettergo"
version = "0.1.0"

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    intellijPlatform {
        goland "2025.3"
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = "253"
            untilBuild = "253.*"
        }
    }
}

kotlin {
    jvmToolchain(21)
}
